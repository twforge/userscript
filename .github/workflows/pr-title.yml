name: PR Title

# PRs are squash-merged with the PR title as commit message. release-please derives the version and CHANGELOG.md from
# these messages, and the changelog is handed in with every submission to the game, so titles must follow Conventional
# Commits (e.g. "feat: show village notes on the village info page") and describe the change for players.

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
